<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OTP Verification - RENVO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/auth.css" />
  </head>
  <body class="auth-page">
    <header class="auth-topbar">
      <div class="container">
        <a href="/index.html" class="logo" aria-label="RENVO home">
          <span class="logo-mark" aria-hidden="true">R</span>
          <span class="logo-text">RENVO</span>
        </a>
        <a href="/index.html" class="auth-back">&larr; Back to home</a>
      </div>
    </header>

    <main class="auth-main">
      <div class="auth-card">
        <div class="auth-card-head">
          <div class="otp-illustration" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <rect x="4" y="3" width="16" height="18" rx="2" stroke="currentColor" stroke-width="1.6" />
              <path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </div>
          <h1>Verify your identity</h1>
          <p>Enter the 6-digit demo code below to continue.</p>
        </div>

        <div id="demoBanner"></div>

        <!-- Shows the demo code so a beginner can actually complete the flow -->
        <div class="otp-code-hint" id="otpHint">
          Demo code: <strong id="otpCode">------</strong>
        </div>

        <!-- OTP inputs -->
        <div class="otp-inputs" id="otpInputs">
          <input type="text" inputmode="numeric" maxlength="1" class="otp-input" aria-label="Digit 1" />
          <input type="text" inputmode="numeric" maxlength="1" class="otp-input" aria-label="Digit 2" />
          <input type="text" inputmode="numeric" maxlength="1" class="otp-input" aria-label="Digit 3" />
          <input type="text" inputmode="numeric" maxlength="1" class="otp-input" aria-label="Digit 4" />
          <input type="text" inputmode="numeric" maxlength="1" class="otp-input" aria-label="Digit 5" />
          <input type="text" inputmode="numeric" maxlength="1" class="otp-input" aria-label="Digit 6" />
        </div>
        <span class="field-error" id="err-otp" style="text-align:center; display:block;"></span>

        <!-- Countdown + resend -->
        <p class="otp-meta" id="otpMeta">Resend available in <span id="countdown">30</span>s</p>
        <div class="resend-row">
          Didn't get a code?
          <button type="button" id="resendBtn" disabled>Resend OTP</button>
        </div>

        <div style="margin-top: var(--space-2);">
          <button type="button" class="btn btn-primary btn-block" id="verifyBtn">Verify OTP</button>
        </div>
      </div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/auth.js"></script>
    <script type="module">
      /* OTP page logic (Vanilla JS) — DEMO only */
      const { showToast, getAccount, setSession, demoBannerHTML, generateOtp, STORAGE_KEYS } = window.RENVO;

      document.getElementById("demoBanner").innerHTML = demoBannerHTML();

      // The code that was generated on signup/login is stored in localStorage.
      // If there isn't one (e.g. user opened this page directly), create one now.
      let currentOtp = localStorage.getItem(STORAGE_KEYS.pendingOtp);
      if (!currentOtp) {
        currentOtp = generateOtp();
        localStorage.setItem(STORAGE_KEYS.pendingOtp, currentOtp);
        localStorage.setItem(STORAGE_KEYS.pendingFlow, "login");
      }
      // Show the code on screen so the demo can be completed without real SMS/email.
      document.getElementById("otpCode").textContent = currentOtp;

      const flow = localStorage.getItem(STORAGE_KEYS.pendingFlow) || "login";
      const inputs = Array.from(document.querySelectorAll(".otp-input"));
      const verifyBtn = document.getElementById("verifyBtn");
      const resendBtn = document.getElementById("resendBtn");
      const countdownEl = document.getElementById("countdown");
      let countdown = 30;
      let countdownTimer = null;

      // Move focus to the next OTP box automatically as the user types.
      inputs.forEach((input, index) => {
        input.addEventListener("input", () => {
          input.value = input.value.replace(/\D/g, ""); // digits only
          if (input.value && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
        });
        // Allow Backspace to go back to the previous box.
        input.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && !input.value && index > 0) {
            inputs[index - 1].focus();
          }
        });
      });

      // Start (or restart) the resend countdown timer.
      function startCountdown() {
        countdown = 30;
        resendBtn.disabled = true;
        countdownEl.textContent = countdown;
        clearInterval(countdownTimer);
        countdownTimer = setInterval(() => {
          countdown--;
          countdownEl.textContent = countdown;
          if (countdown <= 0) {
            clearInterval(countdownTimer);
            resendBtn.disabled = false;
            document.getElementById("otpMeta").textContent = "You can resend the code now.";
          }
        }, 1000);
      }
      startCountdown();

      // Read the 6 digits the user typed and join them into one string.
      function getEnteredOtp() {
        return inputs.map((i) => i.value).join("");
      }

      // Clear the invalid state on all boxes.
      function clearInvalid() {
        inputs.forEach((i) => i.classList.remove("invalid"));
        document.getElementById("err-otp").textContent = "";
      }

      // Verify the entered code against the stored demo code.
      verifyBtn.addEventListener("click", () => {
        const entered = getEnteredOtp();
        if (entered.length !== 6) {
          inputs.forEach((i) => i.classList.add("invalid"));
          document.getElementById("err-otp").textContent = "Please enter all 6 digits.";
          return;
        }
        if (entered !== currentOtp) {
          inputs.forEach((i) => i.classList.add("invalid"));
          document.getElementById("err-otp").textContent = "Incorrect code. Please try again.";
          showToast("Incorrect OTP. Check the demo code shown above.");
          return;
        }

        clearInvalid();

        // OTP is correct — create the login session (demo only).
        const account = getAccount();
        const remember = localStorage.getItem("renvo_remember") === "1";
        setSession({
          email: account ? account.email : "demo@renvo.example",
          fullName: account ? account.fullName : "RENVO User",
          role: null, // role is chosen on the next page
          remember,
          createdAt: Date.now(),
        });

        // Clean up the one-time OTP data.
        localStorage.removeItem(STORAGE_KEYS.pendingOtp);
        localStorage.removeItem(STORAGE_KEYS.pendingFlow);

        showToast("Verified! Choose your role to continue…");
        setTimeout(() => {
          window.location.href = "/role-selection.html";
        }, 800);
      });

      // Resend a fresh demo code and restart the countdown.
      resendBtn.addEventListener("click", () => {
        currentOtp = generateOtp();
        localStorage.setItem(STORAGE_KEYS.pendingOtp, currentOtp);
        document.getElementById("otpCode").textContent = currentOtp;
        inputs.forEach((i) => (i.value = ""));
        inputs[0].focus();
        clearInvalid();
        document.getElementById("otpMeta").innerHTML =
          'Resend available in <span id="countdown">30</span>s';
        // Re-bind the countdown element because we just replaced it.
        startCountdown();
        showToast("A new demo code has been generated.");
      });
    </script>
  </body>
</html>
